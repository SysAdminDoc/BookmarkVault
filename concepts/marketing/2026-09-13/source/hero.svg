<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090812"/>
      <stop offset="0.58" stop-color="#111025"/>
      <stop offset="1" stop-color="#090812"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientTransform="translate(1245 160) rotate(132) scale(760 590)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6c5ce7" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="0" cy="0" r="1" gradientTransform="translate(116 820) rotate(-43) scale(470 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fd79a8" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#fd79a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="82" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#fd79a8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#020207" flood-opacity="0.75"/>
    </filter>
    <filter id="logoShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6c5ce7" flood-opacity="0.35"/>
    </filter>
    <clipPath id="desktopClip">
      <rect x="704" y="158" width="804" height="502" rx="18"/>
    </clipPath>
    <clipPath id="mobileClip">
      <rect x="1263" y="420" width="211" height="422" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#purpleGlow)"/>
  <rect width="1600" height="900" fill="url(#pinkGlow)"/>
  <path d="M0 770C270 690 395 808 655 727s438-23 621-76c119-35 215-20 324 24v225H0V770Z" fill="#ffffff" opacity="0.018"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <image x="80" y="66" width="62" height="62" xlink:href="asset:logo" filter="url(#logoShadow)"/>
    <text x="158" y="107" fill="#f8f7ff" font-size="29" font-weight="700" letter-spacing="-0.4">BookmarkVault</text>
    <text x="82" y="196" fill="#a89ff8" font-size="14" font-weight="700" letter-spacing="2.5">LOCAL-FIRST WEB DIRECTORY</text>

    <text x="78" y="294" fill="#ffffff" font-size="72" font-weight="760" letter-spacing="-2.8">Find the useful</text>
    <text x="78" y="374" fill="#ffffff" font-size="72" font-weight="760" letter-spacing="-2.8">web again.</text>
    <rect x="82" y="406" width="172" height="5" rx="2.5" fill="url(#accentLine)"/>

    <text x="82" y="470" fill="#b9b6c9" font-size="22" font-weight="400">
      <tspan x="82" dy="0">Search 5,000 starter sites, load the included</tspan>
      <tspan x="82" dy="34">50,000-site pack, and keep your own folders.</tspan>
    </text>

    <g transform="translate(82 566)">
      <rect width="252" height="82" rx="13" fill="#171625" stroke="#302d47"/>
      <circle cx="33" cy="41" r="17" fill="#6c5ce7" opacity="0.18"/>
      <path d="M26 41h14m-7-7v14" stroke="#a89ff8" stroke-width="2" stroke-linecap="round"/>
      <text x="60" y="35" fill="#f5f3ff" font-size="16" font-weight="700">Ready on launch</text>
      <text x="60" y="57" fill="#8d899e" font-size="13">5,000 starter sites</text>
    </g>
    <g transform="translate(350 566)">
      <rect width="264" height="82" rx="13" fill="#171625" stroke="#302d47"/>
      <circle cx="33" cy="41" r="17" fill="#fd79a8" opacity="0.14"/>
      <path d="M27 35h12v14H27zM30 32h12v14" fill="none" stroke="#fd91b6" stroke-width="2" stroke-linejoin="round"/>
      <text x="60" y="35" fill="#f5f3ff" font-size="16" font-weight="700">Keep your folders</text>
      <text x="60" y="57" fill="#8d899e" font-size="13">No account required</text>
    </g>

    <text x="82" y="789" fill="#777388" font-size="16">github.com/SysAdminDoc/BookmarkVault</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="112" width="860" height="590" rx="26" fill="#12111c" stroke="#3c3854" stroke-width="2"/>
    <rect x="680" y="112" width="860" height="52" rx="26" fill="#1a1827"/>
    <rect x="680" y="138" width="860" height="26" fill="#1a1827"/>
    <circle cx="715" cy="138" r="6" fill="#fd79a8"/>
    <circle cx="738" cy="138" r="6" fill="#f5c451"/>
    <circle cx="761" cy="138" r="6" fill="#57d9b7"/>
    <text x="799" y="144" fill="#817c94" font-family="Segoe UI, Arial, sans-serif" font-size="14">Your directory, ready to search</text>
    <g clip-path="url(#desktopClip)">
      <image x="511" y="103" width="993" height="621" xlink:href="asset:desktop"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1248" y="399" width="241" height="464" rx="32" fill="#0c0b12" stroke="#6f62c8" stroke-width="2"/>
    <rect x="1258" y="414" width="221" height="438" rx="25" fill="#0a0910"/>
    <g clip-path="url(#mobileClip)">
      <image x="1263" y="420" width="211" height="457" xlink:href="asset:mobile" preserveAspectRatio="xMidYMin slice"/>
    </g>
    <rect x="1327" y="408" width="80" height="6" rx="3" fill="#242134"/>
  </g>
</svg>
